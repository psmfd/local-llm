name: upstream-watch

# Weekly watch for the upstream jundot/omlx events this repo is waiting on
# (#30): a stable release newer than the pinned KNOWN_STABLE (gates a probe-3
# re-run before any upgrade is trusted) and closure of jundot/omlx#1835 (the
# macOS-27 long-context regression — the host holds at macOS 26.x while it is
# open, see CLAUDE.md). The 0.5.0 regression-gate step was removed after the
# 0.4.4→0.5.3 upgrade landed (omlx#2179/#2180 fixed in 0.5.2/0.5.1).
# Each event files one tracking issue, deduped by a title search across open
# AND closed issues so closing the tracking issue never re-triggers a duplicate.
# This job is NOT a required check on any ruleset (adrs/007) — renaming it is
# safe. Maintenance: bump KNOWN_STABLE after each handled release; remove or
# repoint WATCHED_ISSUE once #1835 resolves; retire the workflow when nothing
# is being watched.

on:
  schedule:
    - cron: "0 14 * * 1" # weekly, Monday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  KNOWN_STABLE: "0.5.7"
  WATCHED_ISSUE: "1835"

jobs:
  upstream-watch:
    name: upstream-watch
    runs-on: ubuntu-latest
    steps:
      - name: Check for a new stable oMLX release
        run: |
          set -euo pipefail
          latest="$(gh api repos/jundot/omlx/releases \
            --jq '[.[] | select(.prerelease == false and .draft == false)][0].tag_name // empty')"
          norm="${latest#v}"
          echo "INFO  [omlx ] latest stable: ${latest:-<none>} (pinned: ${KNOWN_STABLE})"
          if [ -z "${norm}" ] || [ "${norm}" = "${KNOWN_STABLE}" ]; then
            echo "OK    [omlx ] no stable release newer than the pin"
            exit 0
          fi
          marker="oMLX stable ${latest}"
          count="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all \
            --search "\"${marker}\" in:title" --json number --jq 'length')"
          if [ "${count}" != "0" ]; then
            echo "SKIP  [omlx ] tracking issue already exists for ${latest}"
            exit 0
          fi
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          The scheduled upstream watch (#30) detected a new stable
          \`jundot/omlx\` release: **${latest}** (pinned known version:
          ${KNOWN_STABLE}).

          Next steps:

          - Re-run \`docs/workhorse-probes.md\` probe 3 before trusting the
            upgrade (upstream Memory Guard retunes can move the sustained-safe
            concurrency mark and the prefill-guard ceiling).
          - Bump \`KNOWN_STABLE\` in \`.github/workflows/upstream-watch.yml\`
            once handled.

          Release notes: https://github.com/jundot/omlx/releases/tag/${latest}
          EOF
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "upstream watch: ${marker} released (probe-3 re-run gate)" \
            --body-file "${body_file}"
          echo "OK    [omlx ] filed tracking issue for ${latest}"

      - name: Check watched upstream issue state
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/jundot/omlx/issues/${WATCHED_ISSUE}" --jq .state)"
          echo "INFO  [watch] jundot/omlx#${WATCHED_ISSUE} state: ${state}"
          if [ "${state}" = "open" ]; then
            echo "OK    [watch] still open — macOS 26.x hold stands"
            exit 0
          fi
          marker="macOS 27 long-context regression"
          count="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all \
            --search "\"${marker}\" in:title" --json number --jq 'length')"
          if [ "${count}" != "0" ]; then
            echo "SKIP  [watch] tracking issue already exists for omlx#${WATCHED_ISSUE}"
            exit 0
          fi
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          The scheduled upstream watch (#30) detected that
          jundot/omlx#${WATCHED_ISSUE} (macOS 27: long-context inference
          ~10–15× slower than 26.6) is now **${state}**.

          Next steps:

          - Verify which oMLX/macOS versions carry the fix before planning the
            macOS upgrade window.
          - Re-evaluate the "hold at macOS 26.x" note in CLAUDE.md; after any
            upgrade, re-run the full \`docs/workhorse-probes.md\` suite before
            trusting production traffic.
          - Remove or repoint \`WATCHED_ISSUE\` in
            \`.github/workflows/upstream-watch.yml\` once handled.

          Upstream: https://github.com/jundot/omlx/issues/${WATCHED_ISSUE}
          EOF
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "upstream watch: omlx#${WATCHED_ISSUE} (${marker}) closed — re-evaluate the macOS 26.x hold" \
            --body-file "${body_file}"
          echo "OK    [watch] filed tracking issue for omlx#${WATCHED_ISSUE}"
